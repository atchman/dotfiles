########################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
########################################################################################
#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
# See https://wiki.hyprland.org/


# Monitors
monitor=eDP-1,1920x1080@60,0x0,1
### fallback rule
monitor=,preferred,auto,1


# Environment Variables
### XDG Specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = GDK_BACKEND,wayland

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
#env = QT_QPA_PLATFORMTHEME,kvantum
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland  


### GTK_THEME= 
# env = XCURSOR_THEME,Tokyo Night     # Gruvbox Dark, Catppucin Latte
env = XCURSOR_SIZE,24


### Execute your favorite apps at launch
exec-once = hyprpaper
#exec-once = eww open bar
exec-once = waybar
exec-once = mako

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/hypr/scripts/xdg-portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP    # Wayland magic (screen sharing etc.)
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP    # More wayland magic (screen sharing etc.)
exec-once = wl-paste --type text --watch cliphist store    # clipboard store text data
exec-once = wl-paste --type image --watch cliphist store    # clipboard store image data
#exec-once = /usr/lib/at-spi-bus-launcher --launch-immediately
#exec-once = systemctl --user restart pipewire    # Restart pipewire to avoid bugs

exec-once = firewall-applet
exec-once = system-config-printer-applet
exec-once = nm-applet & xfce4-power-manager

exec-once = mullvad-vpn
#exec-once = flameshot


# autostart
#exec-once = brave
#exec-once = thunderbird
#exec-once = element-desktop
#exec-once = keepassxc


input {
    kb_layout = de    # de,us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    sensitivity = 0.0     # -1.0 - 1.0, 0 means no modification.
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }
}
gestures {
    workspace_swipe = false
}
# Device Config
device:logitech-wireless-mouse {
    sensitivity = 0.0
}


general {
    gaps_in = 5
    gaps_out = 13
    border_size = 3
    col.active_border = rgb(33ccff) rgba(00ff99ee) 30deg
    col.inactive_border = rgba(595959aa)
    cursor_inactive_timeout = 4
    layout = dwindle
}


decoration {
    rounding = 3
    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(00000080)
    shadow_offset = 4 4

    blur {
        enable = true
        size = 3
        passes = 1
        new_optimizations = true
    }
}


animations {
    enabled = true
    
    # animation curves
    ### https://www.cssportal.com/css-cubic-bezier-generator/
    bezier = cubic-bezier, 0.05, 0.9, 0.1, 1.05
    ### animation configs
    animation = windows, 1, 7, cubic-bezier, slide
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 0.0000001, default
    animation = workspaces, 1, 6, default, slide
}


dwindle {
    pseudotile = true    # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true    # you probably want this
}


master {
    new_is_master = true
    new_on_top = false
    orientation = left
}


# Window Rules 
# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

windowrulev2 = workspace 1, class:^(Brave-browser)$
windowrulev2 = workspace 8, class:^(Element)$
windowrulev2 = workspace 9, class:^(thunderbird)$
windowrulev2 = workspace 7, class:^(WebCord)$
windowrulev2 = workspace 6, class:^(KeePassXC)$
windowrulev2 = workspace 3, class:^(Gnucash)$
windowrulev2 = workspace 3, class:^(Portfolio Performance)$ 
windowrulev2 = workspace 4, class:^(XIVLauncher.Core)$ 


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, alacritty
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod SHIFT, M, exit,
bind = $mainMod SHIFT, X, exec, swaylock

bind = $mainMod, F, fullscreen, 0
bind = $mainMod, C, centerwindow
bind = $mainMod, S, pin

bind = $mainMod, E, exec, thunar
bind = $mainMod, H, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

bind = $mainMod, V, togglefloating, 
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
