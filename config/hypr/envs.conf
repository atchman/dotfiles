# Environment Variables

# XDG Specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Toolkit
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland    # ,x11
env = CLUTTER_BACKEND,wayland


env = _JAVA_AWT_WM_NONREPARENTING,1

# nvidia
# env = LIBVA_DRIVER_NAME,iHD

# wlroots
# env = WLR_RENDERER,vulkan
# env = WLR_NO_HARDWARE_CURSORS,1
# env = WLR_DRM_NO_ATOMIC,1
env = WLR_LIBINPUT_NO_DEVICES, 1
# env = XWAYLAND_NO_GLAMOR,1  with this you'll need to use gamescope for gaming

# G-SYNC
# env = __GL_GSYNC_ALLOWED,1
# env = __GL_VRR_ALLOWED,1

# Mozilla
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1

# Theme
# Cursor
# env = XCURSOR_THEME,Qogir-dark
# env = XCURSOR_SIZE,28
# or use tools such as lxappearance or nwg-look
# env = GTK_THEME,Arc-X-P
# env = QT_STYLE_OVERRIDE,Qogir-dark


#
env = TERM,foot
env = BROWSER,org.mozilla.firefox

