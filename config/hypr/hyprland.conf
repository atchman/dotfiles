# hyprland config

# monitors
monitor=eDP-1,1920x1080,0x0,1
# 1920x1080@59.96 Hz
# monitor=eDP-1, modeline 172.68  1920 2040 2248 2576  1080 1081 1084 1118 -hsync +vsync, 0x0, 1
# 1920x1080@60 Hz
# monitor=eDP-1, modeline 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync, 0x0, 1
# fallback rule
# monitor=,preferred,auto,auto

# environment variables
source=~/.config/hypr/envs.conf

# workspace rules
source=~/.config/hypr/workspaces.conf
# window rules
source=~/.config/hypr/windowrules.conf

# execute your favorite apps at launch
source=~/.config/hypr/execs.conf

# key binds
source=~/.config/hypr/keybinds.conf

general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(33ccff) rgba(00ff99ee) 30deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

dwindle {
    pseudotile = true    # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    force_split = 2     # 2 = always split to the right
    preserve_split = true    # you probably want this
    default_split_ratio = 2
    split_bias = 1
}

master {
    new_status = master
    new_on_top = false
    orientation = left
}

decoration {
    rounding = 3

    blur {
        # battery drain
        enabled = false
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        # battery drain
        enabled = false
        range = 4
        render_power = 3
        ignore_window = true
        color = rgba(00000080)
        offset = 4, 4
    }
}

animations {
    enabled = true
    first_launch_animation = false
    # animation curves
    # https://www.cssportal.com/css-cubic-bezier-generator/
    bezier = cubic-bezier, 0.05, 0.9, 0.1, 1.05
    # animation configs
    animation = windows, 1, 7, cubic-bezier, slide
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 0.0000001, default
    animation = workspaces, 1, 6, default, slide
}

input {
    kb_layout = de    # de,us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    sensitivity = 0.0     # -1.0 - 1.0, 0 means no modification.
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }
}

# Device Config
# device{
#   name = logitech-wireless-mouse
#   sensitivity = 0.0
#  }

gestures {
    workspace_swipe = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    disable_autoreload = true
}

xwayland {
    # force_zero_scaling = true
}

cursor { 
    inactive_timeout = 4
}

debug {
    disable_logs = false
    enable_stdout_logs = false 
    # suppress_errors = true
}

# plugin
source=~/.config/hypr/plugin.conf
