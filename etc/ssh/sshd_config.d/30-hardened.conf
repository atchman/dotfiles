# hardened sshd config

Protocol 2

#ListenAddress 

KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
KerberosAuthentication no
GSSAPIAuthentication no
IgnoreRhosts yes

PasswordAuthentication no
UsePAM yes
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitEmptyPasswords no
PermitRootLogin no

HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key


Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com #,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
HostKeyAlgorithms ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,ssh-ed25519,ssh-ed25519,rsa-sha2-512,rsa-sha2-256
KexAlgorithms curve25519-sha256@libssh.org #,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256
Macs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com #,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
PubkeyAcceptedAlgorithms ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256


RequiredRSASize 4096

LogLevel VERBOSE
UseDNS no
ClientAliveInterval 300
ClientAliveCountMax 3
LoginGraceTime 15
StrictModes yes
MaxAuthTries 3
MaxSessions 5
MaxStartups 4
TCPKeepAlive yes
UseLogin no
UsePrivilegeSeparation yes
X11Forwarding no
PermitUserEnvironment no

AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

PrintMotd no

Banner no